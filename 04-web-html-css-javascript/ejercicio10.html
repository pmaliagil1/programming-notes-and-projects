<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cara o Cruz</title>
</head>

<body>

    <script>
        var numeroAleatorio = Math.random();

        if (numeroAleatorio < 0.5) {
            document.write("Cara");
        } else {
            document.write("Cruz");
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Edad y Saldo</title>
</head>
<body>

<script>
    let edad = prompt("Por favor, introduce tu edad:");

    edad = parseInt(edad);

    let saldo = prompt("Por favor, introduce tu saldo:");

    saldo = parseFloat(saldo);

    if (edad > 18 && saldo > 100) {
        alert("Puedes seguir jugando.");
    } else {
        alert("Lo siento, no cumples los requisitos para jugar.");
    }
</script>

</body>
</html>

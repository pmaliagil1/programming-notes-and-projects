<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo Letra DNI</title>
</head>
<body>
    <script>
        var letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E', 'T'];
        var numeroDNI = prompt("Introduce el número de DNI (sin la letra):");
        var letraDNIUsuario = prompt("Introduce la letra del DNI:");

        if (numeroDNI < 0 || numeroDNI > 99999999) {
            alert("El número de DNI proporcionado no es válido.");
        } else {
            var resto = numeroDNI % 23;
            var letraCalculada = letras[resto];

            if (letraDNIUsuario.toUpperCase() !== letraCalculada) {
                alert("La letra del DNI que has introducido no es correcta.");
            } else {
                alert("El número y la letra del DNI son correctos.");
            }
        }
    </script>
</body>
</html>

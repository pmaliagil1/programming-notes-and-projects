<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Table</title>
    </head>
    <body>
        <table border ="1">
            <caption>Example</caption>
            <thead>
                <tr>
                    <th colspan="4">One</th>
                    <th>Eleven</th>
                    <th>Twelve</th>
                </tr>
                <tr>
                    <th rowspan="2">Two</th>
                    <td>Five</td>
                    <td>Six</td>
                    <td>Seven</td>
                    <td>Fifty</td>
                    <td>Sixty</td>
                </tr>
                <tr>
                    <td>Eight</td>
                    <td>Nine</td>
                    <td>Ten</td>
                    <td>Fourty</td>
                    <td>Hundred</td>
                </tr>
                <tr>
                    <th>Twohundred</th>
                </tr>
            </thead>
        </table>
    </body>
</html>
